spring.application.name=backend

server.port=8080
# Secrets live in the root .env (local runs); Docker passes them as env vars
spring.config.import=optional:file:../.env[.properties]
server.error.include-message=always
spring.output.ansi.enabled=ALWAYS

#Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/dataanalytics
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#Jpa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Jwt
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

#Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

# Backblaze B2 Configuration
backblaze.endpoint=https://s3.eu-central-003.backblazeb2.com
backblaze.key-id=${B2_KEY_ID}
backblaze.application-key=${B2_APPLICATION_KEY}
backblaze.bucket-name=DataAnalyticsDS
backblaze.region=eu-central-003